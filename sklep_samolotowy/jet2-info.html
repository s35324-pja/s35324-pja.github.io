<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroPrivé | Prywatne Odrzutowce i Luksusowe Podróże</title>
    <link rel="stylesheet" href="style1.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <header class="header">
        <div class="header-container">
            <div class="brand-logo">AERO<span>PRIVÉ</span></div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="flota.html" class="nav-link active">Nasza Flota</a></li>
                    <li><a href="charter.html" class="nav-link">Kontakt</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="section-flota">
        <span class="aircraft__gallery-background--anchor"></span>
        <div id="plane-3463" class="aircraft aircraft--active">
            <div class="aircraft__details">
                <div class="aircraft__ico">
                    <img src="https://jetstory.com/bin/3cf3f932fa1a55d6fa0e1493c3fdc13b.svg" alt="" class="flota__svg">
                </div>
                <h2 class="aircraft__title">Bombardier Challenger 3500</h2>
                <ul class="aircraft__list">
                    <li class="aircraft__item">Liczba miejsc:<span class="aircraft__item-light"> 9 </span></li>
                    <li class="aircraft__item">Prędkość przelotowa:<span class="aircraft__item-light"> 870 km/h </span></li>
                    <li class="aircraft__item">Stewardesy:<span class="aircraft__item-light">1</span></li>
                    <li class="aircraft__item">Toaleta:<span class="aircraft__item-light"> tak </span></li>
                    <li class="aircraft__item">Posiłki ciepłe/zimne:<span class="aircraft__item-light"> tak / tak </span></li>
                    <li class="aircraft__item">Piloci:<span class="aircraft__item-light"> 2 </span></li>
                    <li class="aircraft__item">Zasięg:<span class="aircraft__item-light"> 6 300 km </span></li>
                </ul>
                <img src="https://jetstory.com/bin/b37a03818cc8b44597b198beb267d55e.svg" alt="" class="aircraft__map">
                <a href="charter.html" class="aircraft__button button button--1">Zarezerwuj lot</a>
            </div>
            
            <div class="aircraft__gallery-container">
                <div class="swiper aircraft__gallery">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/1s/1s7a2dz1fxdq3qxvyqgfkt4oq87sumfq.jpg" alt="" class="aircraft__img"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/cy/cyfvu5a483w5quryo7xy3y3f67pftf5w.jpg" alt="" class="aircraft__img"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/jn/jnk78mnh2amb7ri6temfcwncmmjthxp2.jpg" alt="" class="aircraft__img"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/mt/mta7orrconh5ymscmsm3pmztqaiv7e3n.jpg" alt="" class="aircraft__img"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/qy/qy87njobwh38547165rttwirdhzdiobo.jpg" alt="" class="aircraft__img"></div>
                    </div>
                    
                    <div class="swiper-pagination"></div>
                    
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>
        </div>
    </section>

 <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const swiper = new Swiper('.aircraft__gallery', {
                loop: true,
                speed: 600,
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                },
                autoplay: {
                    delay: 5000,
                    disableOnInteraction: false,
                },
            });
        });
    </script>
</body>
</html>
