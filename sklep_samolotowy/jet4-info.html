<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroPrivé | Embraer Legacy 600</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <header class="header">
        <div class="header-razem">
            <div class="logo">AERO<span>PRIVÉ</span></div>
            <nav class="nawigacja">
                <ul>
                    <li><a href="index.html" class="link-menu">Home</a></li>
                    <li><a href="flota.html" class="link-menu active">Nasza Flota</a></li>
                    <li><a href="charter.html" class="link-menu">Kontakt</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="sekcja-flota">
        <div id="plane-legacy" class="pudelko-samolotu">
            
            <div class="lewy-tekst">
                <div class="samolot-ikona">
                    <img src="https://jetstory.com/bin/d727f89a00db886e82d4105adc9e6095.svg" alt="Ikona" class="svg-ikona">
                </div>
                <h2 class="tytul-samolotu">Embraer Legacy 600</h2>
                <ul class="lista-cech">
                    <li class="linia-cechy">Liczba miejsc:<span class="wartosc-jasna"> 13 </span></li>
                    <li class="linia-cechy">Prędkość przelotowa:<span class="wartosc-jasna"> 835 km/h </span></li>
                    <li class="linia-cechy">Stewardesy:<span class="wartosc-jasna">1+1</span></li>
                    <li class="linia-cechy">Toaleta:<span class="wartosc-jasna"> tak </span></li>
                    <li class="linia-cechy">Posiłki ciepłe/zimne:<span class="wartosc-jasna"> tak / tak </span></li>
                    <li class="linia-cechy">Piloci:<span class="wartosc-jasna"> 2 </span></li>
                    <li class="linia-cechy">Zasięg:<span class="wartosc-jasna"> 6 000 km </span></li>
                </ul>
                <img src="https://jetstory.com/bin/b37a03818cc8b44597b198beb267d55e.svg" alt="Mapa zasięgu" class="mapa-zasiegu">
                <a href="charter.html" class="przycisk-rezerwacja">Zarezerwuj lot</a>
            </div>
            
            <div class="prawy-galeria">
                <div class="swiper moja-karuzela">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/ht/ht5bwx96ih484fz7ns2rkt39kz1486ek.jpg" alt="Zdjęcie 1" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://aeroaffaires.fr/wp-content/uploads/2019/04/legacy_600_in_flight_over_the_clouds_1-jpg__1200x675_q85_crop_subsampling-2_upscale.jpg" alt="Zdjęcie 2" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/zb/zbcfusjgo625j4omzcwvgz42dtr7vvys.jpg" alt="Zdjęcie 3" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://aerovisto.com/wp-content/uploads/elementor/thumbs/7419_Embraer_legacy_600_CC-r8hyvlxajonhhpamwc09c55h1ojccbvzt6getm2bkg.webp" alt="Zdjęcie 4" class="fotka-samolotu"></div>
                    </div>
                    
                    <div class="swiper-pagination"></div>
                    
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>
            
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            new Swiper('.moja-karuzela', {
                loop: true,
                speed: 600,
                pagination: { el: '.swiper-pagination', clickable: true },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
                autoplay: { delay: 5000, disableOnInteraction: false },
            });
        });
    </script>
</body>
</html>
