<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroPrivé | Gulfstream 650ER</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <header class="header">
        <div class="header-razem">
            <div class="logo">AERO<span>PRIVÉ</span></div>
            <nav class="nawigacja">
                <ul>
                    <li><a href="index.html" class="link-menu">Home</a></li>
                    <li><a href="flota.html" class="link-menu active">Nasza Flota</a></li>
                    <li><a href="charter.html" class="link-menu">Kontakt</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="sekcja-flota">
        <div id="plane-gulfstream" class="pudelko-samolotu">
            
            <div class="lewy-tekst">
                <div class="samolot-ikona">
                    <img src="https://jetstory.com/bin/f0c23ed0f638e11d8c8bc0bdb417da14.svg" alt="Ikona" class="svg-ikona">
                </div>
                <h2 class="nazwa-samolotu">Gulfstream 650ER</h2>
                <ul class="lista-cech">
                    <li class="linia-cechy">Liczba miejsc:<span class="wartosc-jasna"> 13 </span></li>
                    <li class="linia-cechy">Prędkość przelotowa:<span class="wartosc-jasna"> 900 km/h </span></li>
                    <li class="linia-cechy">Stewardesy:<span class="wartosc-jasna">tak</span></li>
                    <li class="linia-cechy">Toaleta:<span class="wartosc-jasna"> tak </span></li>
                    <li class="linia-cechy">Posiłki ciepłe/zimne:<span class="wartosc-jasna"> tak / tak </span></li>
                    <li class="linia-cechy">Piloci:<span class="wartosc-jasna"> 2 </span></li>
                    <li class="linia-cechy">Zasięg:<span class="wartosc-jasna"> 12 038 km </span></li>
                </ul>
                <img src="https://jetstory.com/bin/b37a03818cc8b44597b198beb267d55e.svg" alt="Mapa zasięgu" class="mapa-zasiegu">
                <a href="charter.html" class="przycisk-rezerwacja">Zarezerwuj lot</a>
            </div>
            
            <div class="prawy-galeria">
                <div class="swiper moja-karuzela">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/fv/fve9hgaw3p2ujvbvy8rewquevdtavw5s.jpg" alt="Zdjęcie 1" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/vi/vim19btca2fzfkedvmwbbdoaec4dv7tw.jpg" alt="Zdjęcie 2" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/y3/y3dx9bi8qmwyzyvcr29tmqjdikkfb17m.jpg" alt="Zdjęcie 3" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/9q/9qpiprredrtj2a5abbdo1s326diory7z.jpg" alt="Zdjęcie 4" class="fotka-samolotu"></div>
                    </div>
                    
                    <div class="swiper-pagination"></div>
                    
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>
            
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            new Swiper('.moja-karuzela', {
                loop: true,
                speed: 600,
                pagination: { el: '.swiper-pagination', clickable: true },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
                autoplay: { delay: 5000, disableOnInteraction: false },
            });
        });
    </script>
</body>
</html>
