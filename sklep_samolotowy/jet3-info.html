<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroPrivé | Bombardier Global 5000</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <header class="header">
        <div class="header-razem">
            <div class="logo">AERO<span>PRIVÉ</span></div>
            <nav class="nawigacja">
                <ul>
                    <li><a href="index.html" class="link-menu">Home</a></li>
                    <li><a href="flota.html" class="link-menu active">Nasza Flota</a></li>
                    <li><a href="charter.html" class="link-menu">Kontakt</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="sekcja-flota">
        <div id="plane-global" class="pudelko-samolotu">
            
            <div class="lewy-tekst">
                <div class="samolot-ikona">
                    <img src="https://jetstory.com/bin/75097d3159d160a740608b74e3ec74ea.svg" alt="Ikona" class="svg-ikona">
                </div>
                <h2 class="nazwa-samolotu">Bombardier Global 5000</h2>
                <ul class="lista-cech">
                    <li class="linia-cechy">Liczba miejsc:<span class="wartosc-jasna"> 14 </span></li>
                    <li class="linia-cechy">Prędkość przelotowa:<span class="wartosc-jasna"> 920 km/h </span></li>
                    <li class="linia-cechy">Stewardesy:<span class="wartosc-jasna">1+1</span></li>
                    <li class="linia-cechy">Toaleta:<span class="wartosc-jasna"> tak </span></li>
                    <li class="linia-cechy">Posiłki ciepłe/zimne:<span class="wartosc-jasna"> tak / tak </span></li>
                    <li class="linia-cechy">Piloci:<span class="wartosc-jasna"> 2 </span></li>
                    <li class="linia-cechy">Zasięg:<span class="wartosc-jasna"> 9 600 km </span></li>
                </ul>
                <img src="https://jetstory.com/bin/b37a03818cc8b44597b198beb267d55e.svg" alt="Mapa zasięgu" class="mapa-zasiegu">
                <a href="charter.html" class="przycisk-rezerwacja">Zarezerwuj lot</a>
            </div>
            
            <div class="prawy-galeria">
                <div class="swiper kropeczki">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/sp/spqbx3a3i47q68e7fu6of1q2xzok33m5.jpg" alt="Zdjęcie 1" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/m3/m3jrwymw6v9zha45dxo1hejj16c96qo3.jpg" alt="Zdjęcie 2" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/eg/eg84z27o28fpmhqpen8axvi2hsxzmazw.jpg" alt="Zdjęcie 3" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/ot/otc41coeq5n5h6jqntdz4ym2r27j5u94.jpg" alt="Zdjęcie 4" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/ir/irz4px33aibxxqcvabi92d2sh5sa4szs.jpg" alt="Zdjęcie 5" class="fotka-samolotu"></div>
                        <div class="swiper-slide"><img src="https://ipla.pluscdn.pl/dituel/cp/mr/mruhnuegnbfv22johix441jzk6wfxjoi.jpg" alt="Zdjęcie 6" class="fotka-samolotu"></div>
                    </div>
                    
                    <div class="swiper-pagination"></div>
                    
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>
            
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            new Swiper('.kropeczki', {
                loop: true,
                speed: 600,
                pagination: { el: '.swiper-pagination', clickable: true },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
                autoplay: { delay: 5000, disableOnInteraction: false },
            });
        });
    </script>
</body>
</html>
